[package]
name = "freshdock"
version = "0.0.1"
edition = "2024"
description = "A modern Rust-based Docker container auto-updater. Successor to Watchtower with health-gated rollback. Work in progress — placeholder release."
license = "Apache-2.0"
repository = "https://github.com/Turbootzz/freshdock"
readme = "README.md"
keywords = ["docker", "container", "watchtower", "auto-update", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
bollard = "0.21"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
comfy-table = "7"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
# testcontainers will be re-added in Phase 3 once a release compatible with
# bollard 0.21 is available; the current 0.27.x line pins bollard 0.20.
