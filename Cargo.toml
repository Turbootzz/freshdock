[package]
name = "freshdock"
version = "1.4.2"
edition = "2024"
rust-version = "1.95.0"
authors = ["Turbootzz <thijs@turboot.com>"]
description = "A modern Rust-based Docker container auto-updater: a maintained, health-gated, single-binary successor to Watchtower."
license = "Apache-2.0"
repository = "https://github.com/Turbootzz/freshdock"
homepage = "https://freshdock.dev"
documentation = "https://docs.rs/freshdock"
readme = "README.md"
keywords = ["docker", "container", "watchtower", "auto-update", "devops"]
categories = ["command-line-utilities", "development-tools"]
# Ship code + README/LICENSE only; repo guides/CI don't help `cargo install`.
exclude = [".github/", "docs/", "examples/", "RELEASE.md", "RELEASE_NOTES.md", "freshdock.toml.example", "book.toml", "book/"]

[dependencies]
bollard = "0.21"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset", "query"] }
# Parse shoutrrr-style notify URLs (issue #54); percent-encoding decodes userinfo.
# Both already in-tree via reqwest, so no new version for cargo-deny.
url = "2"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
comfy-table = "7"
futures = "0.3"
async-trait = "0.1"
# Calendar primitive only (DST-correct `DateTime<Local>`); cron parser + loop are
# hand-rolled (PLAN §10 Q3). `clock` brings `Local`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# SMTP backend (Phase 6). Hand-pick rustls features so the provider is `aws-lc-rs`
# (matching reqwest); the convenience `tokio1-rustls-tls` would pull `ring` and
# duplicate rustls providers, tripping cargo-deny.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }

[dev-dependencies]
wiremock = "0.6"
# `test-util` enables `#[tokio::test(start_paused = true)]` for virtual-time tests.
tokio = { version = "1.52", features = ["test-util"] }
# `testcontainers` intentionally NOT used: its 0.27.x pins bollard 0.20 (we use
# 0.21), duplicating bollard and failing cargo-deny. Live tests drive raw bollard
# 0.21 instead, gated `#[ignore = "needs-docker"]`.
