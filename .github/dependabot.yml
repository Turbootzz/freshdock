version: 2

updates:
  # Group minor+patch to keep Cargo.lock churn reviewable; majors stay separate.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions across ci.yml, release.yml, release-plz.yml, docs.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-all:
        patterns:
          - "*"

  # No `docker` ecosystem: the base is a floating `:latest` tag with no digest,
  # which Dependabot can't track. Pin a digest to enable it.
