name: Release

# Tagging `vX.Y.Z` cross-compiles the static binaries and publishes a
# multi-arch image to GHCR (amd64, arm64, armv7). Issue #19 / PLAN §7.
on:
  push:
    tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/turbootzz/freshdock

# Least privilege by default (covers the build job); the image job widens to
# packages: write for the GHCR push.
permissions:
  contents: read

jobs:
  # Reuse the CI cross-compile toolchain (houseabsolute/actions-rust-cross,
  # P0-2) to build one static-musl binary per target, then stage each under a
  # buildx-friendly name (freshdock-<arch><variant>).
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            suffix: amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            suffix: arm64
          - target: armv7-unknown-linux-musleabihf
            platform: linux/arm/v7
            suffix: armv7
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (${{ matrix.target }})
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/freshdock dist/freshdock-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v7
        with:
          name: freshdock-${{ matrix.suffix }}
          path: dist/freshdock-${{ matrix.suffix }}
          if-no-files-found: error

  image:
    name: Multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Collect every per-arch binary back into a single dist/ tree the
      # Dockerfile COPYs from.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: freshdock-*
          merge-multiple: true

      - name: Make binaries executable
        run: |
          chmod +x dist/freshdock-*
          ls -l dist

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Prove the crate still packages cleanly for crates.io, in parallel with the
  # build. A tag that can't be packaged fails here before the approval gate is
  # ever reached — no irreversible action, no upload.
  package-check:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked

  # Cut the GitHub Release once binaries AND the image are up, attaching the
  # per-arch musl binaries plus a SHA256SUMS for verification.
  release:
    name: GitHub Release
    needs: [build, image, package-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: freshdock-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          chmod +x freshdock-*
          sha256sum freshdock-amd64 freshdock-arm64 freshdock-armv7 > SHA256SUMS
          cat SHA256SUMS

      # A tag with a hyphen (e.g. v1.0.0-rc.1) is a pre-release: it must not show
      # as "Latest" on the releases page.
      - name: Detect prerelease
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.pre.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/freshdock-amd64
            dist/freshdock-arm64
            dist/freshdock-armv7
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  # crates.io publish — the only irreversible step, so it runs last and is gated
  # behind the `release` environment. A tag push builds binaries, the image, and
  # the GitHub Release, then PAUSES here until a required reviewer clicks Approve
  # in the Actions UI. A bare `git push --tags` can therefore never auto-publish.
  publish:
    name: Publish to crates.io
    needs: [build, image, release, package-check]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Refuse to publish if the tag and Cargo.toml disagree (e.g. tagging
      # v1.0.0 while Cargo.toml still says 1.0.0-rc.1). Fails before any upload.
      - name: Verify tag matches Cargo.toml version
        run: |
          crate_ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "crate=$crate_ver tag=$tag_ver"
          [ "$crate_ver" = "$tag_ver" ] || { echo "::error::tag $tag_ver != Cargo.toml $crate_ver"; exit 1; }

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
