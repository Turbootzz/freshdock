name: Release

# Tagging `vX.Y.Z` cross-compiles the static binaries and publishes a
# multi-arch image to GHCR (amd64, arm64, armv7). Issue #19 / PLAN §7.
on:
  push:
    tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/turbootzz/freshdock

jobs:
  # Reuse the CI cross-compile toolchain (houseabsolute/actions-rust-cross,
  # P0-2) to build one static-musl binary per target, then stage each under a
  # buildx-friendly name (freshdock-<arch><variant>).
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            suffix: amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            suffix: arm64
          - target: armv7-unknown-linux-musleabihf
            platform: linux/arm/v7
            suffix: armv7
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (${{ matrix.target }})
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/freshdock dist/freshdock-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v7
        with:
          name: freshdock-${{ matrix.suffix }}
          path: dist/freshdock-${{ matrix.suffix }}
          if-no-files-found: error

  image:
    name: Multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Collect every per-arch binary back into a single dist/ tree the
      # Dockerfile COPYs from.
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: freshdock-*
          merge-multiple: true

      - name: Make binaries executable
        run: |
          chmod +x dist/freshdock-*
          ls -l dist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
