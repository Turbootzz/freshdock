name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Install the toolchain pinned in rust-toolchain.toml. rustup reads
      # the file automatically; this keeps CI and the local pre-push hook
      # on the exact same compiler + clippy ruleset without duplicating
      # the version string here.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4

      - name: cargo deny check
        run: cargo deny check

  integration:
    name: Live recreate gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # ubuntu-latest ships a running Docker daemon, so the `#[ignore]`d live
      # "weird config" round-trip (PLAN §6.3, P3-3) can run here — it is the
      # release-blocker quality gate and does not run in the default test job.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The test skips gracefully if the daemon is unreachable; in this gate
      # job a missing daemon must FAIL, not silently pass, so assert it first.
      - name: Assert Docker daemon is up
        run: docker version

      - name: Live recreate round-trip (quality gate)
        run: cargo test --locked --test recreate_roundtrip_live -- --ignored --nocapture

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (${{ matrix.target }})
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freshdock-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/freshdock
          if-no-files-found: error
