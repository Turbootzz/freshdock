name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install the toolchain pinned in rust-toolchain.toml. rustup reads
      # the file automatically; this keeps CI and the local pre-push hook
      # on the exact same compiler + clippy ruleset without duplicating
      # the version string here.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-deny@0.19.4

      - name: cargo deny check
        run: cargo deny check

  integration:
    name: Live recreate gate
    runs-on: ubuntu-latest
    # The gate itself runs in about two minutes; the rest is the build. Generous
    # headroom, but bounded, so a wedged daemon cannot burn a six-hour slot.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Both live suites skip themselves when no daemon answers, which is right
      # for a developer running `--ignored` on a laptop but wrong here: this job
      # exists to exercise a real daemon, so a skip would be a green no-op that
      # proves nothing. This flips every skip into a failure.
      FRESHDOCK_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships a running Docker daemon, so the `#[ignore]`d live
      # "weird config" round-trip (PLAN §6.3, P3-3) can run here — it is the
      # release-blocker quality gate and does not run in the default test job.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Belt and braces alongside FRESHDOCK_LIVE_REQUIRED: fail on a dead
      # daemon before spending a build on tests that cannot run.
      - name: Assert Docker daemon is up
        run: docker version

      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: just

      # Every `#[ignore]`d test, so a new live test needs no change here.
      # The recipe carries the flags and why they matter.
      - name: Live daemon gate
        run: just live

  nerdctl-integration:
    name: Live nerdctl gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NERDCTL_VERSION: "2.3.4"
      # sha256 of nerdctl-full-2.3.4-linux-amd64.tar.gz, pinned here rather than
      # read from the same release, so a replaced asset fails the job. Update it
      # together with NERDCTL_VERSION.
      NERDCTL_SHA256: "40a80a6eec6fc4f225473a87946c2098821b6ec31becef0120c8a50d7b4e432c"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: just

      # The runner's containerd belongs to Docker and may be older than the
      # bundle's. Replace it with the nerdctl-full bundle (containerd, CNI and
      # nerdctl together); its unit in /usr/local takes precedence over the
      # packaged one. The download is checked against the pinned NERDCTL_SHA256.
      - name: Install nerdctl (full bundle)
        run: |
          base="https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}"
          file="nerdctl-full-${NERDCTL_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "$base/$file"
          echo "$NERDCTL_SHA256  $file" | sha256sum -c -
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo tar -C /usr/local -xzf "$file"
          sudo systemctl daemon-reload
          sudo systemctl restart containerd
          sudo nerdctl version

      # Runs the #[ignore]d nerdctl tests as root; they opt in through
      # FRESHDOCK_NERDCTL_LIVE, which the recipe sets.
      - name: Live nerdctl gate
        run: just live-nerdctl

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain + target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (${{ matrix.target }})
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freshdock-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/freshdock
          if-no-files-found: error
