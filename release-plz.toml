# release-plz keeps a version-bump + CHANGELOG PR open (see
# .github/workflows/release-plz.yml). Everything irreversible — tagging, the
# GitHub Release, and the crates.io publish — stays in release.yml, driven by a
# human-pushed tag and the `release` environment approval. So release-plz must
# NOT tag, release, or publish; it only authors the release PR.
[workspace]
git_tag_enable = false
git_release_enable = false
publish = false
# freshdock is a binary; `lib.rs` re-exports modules as `pub` only so integration
# tests can reach internals — nothing consumes it as a library crate. Without this,
# cargo-semver-checks flags internal API changes (e.g. a new enum variant) as
# "breaking" and release-plz bumps the major version, which misleads CLI users.
# Disabled so version bumps follow conventional-commit types (feat -> minor,
# fix -> patch); write `feat!`/`BREAKING CHANGE` deliberately for a real major.
semver_check = false
