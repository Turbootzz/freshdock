# release-plz keeps a version-bump + CHANGELOG PR open (see
# .github/workflows/release-plz.yml). Everything irreversible — tagging, the
# GitHub Release, and the crates.io publish — stays in release.yml, driven by a
# human-pushed tag and the `release` environment approval. So release-plz must
# NOT tag, release, or publish; it only authors the release PR.
[workspace]
git_tag_enable = false
git_release_enable = false
publish = false
# Binary crate: the lib API is public only for tests, not a real contract. Off so
# version bumps follow commit types instead of cargo-semver-checks.
semver_check = false

# The changelog is user-facing patch notes: keep plumbing commit types out of it
# (the default lumps them under "Other"). Breaking changes always surface.
[changelog]
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^fix", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^perf", group = "performance" },
    { message = "^revert", group = "reverted" },
    { message = "^docs", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },
    { message = "^test", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
    { message = "^refactor", skip = true },
    { message = ".*", group = "other" },
]
